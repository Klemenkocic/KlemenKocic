        start_date: 2025-07
        end_date: present
        location: Munich, Germany
        highlights:
          - Co-led ~6 capability-assessment engagements with senior leaders across healthcare, sport, law, marketing, automotive sales, and architecture. Translated ambiguous AI goals into specific workflows, each shipped as a working product or reference architecture their team adopted.
          - "Co-architect of Luminosity, our internal multi-agent multi-person production system for seven people, designed around the three-layer architecture (Interaction, Coordination, Data) behind the company's \"AI that instruments the human\" thesis."
          - "Built Luminosity's video pipeline and team-coordination workflows. Co-built the runtime: agent provisioning, MCP tool servers, the rules-and-skills harness, and knowledge and context graphs."
          - "Built and operate the company's weekly AI-intelligence pipeline: ~14 parallel agents pull from 40+ sources across 12 categories, routing ~50 net-new entries a week into Tana, Slack, and a shared GitHub doc with per-person and per-agent callouts so each teammate (and each agent) gets a concrete list of items to act on."
          - Co-inventor on patents covering multi-agent multi-team coordination.
          - Shape Luminous Group's editorial voice on public surfaces (website, positioning, bios) with the founding team. Co-author of eight of the twenty essays at luminousgroup.net/liminality on human-AI collaboration.

      - company: NHS Personal Training GmbH
        position: Technical Lead
        start_date: 2025-01
        end_date: 2026-02
        location: Munich, Germany
        highlights:
          - "Co-developed a native iOS coaching app (Swift, SwiftUI) purpose-built for the gym's one-on-one personal training methodology: adopted by every trainer and client, still in daily production use across the gym's coaching team."
          - Built the web platform covering scheduling, training plans, exercise libraries, invoicing, and point-of-sale, plus a bilingual corporate site and 5 partner portals expanding B2B reach.
          - "Coordinated 6 offshore engineers across concurrent product streams at 78% on-time release rate. Deployed AI into the coaching team's daily workflow: pgvector retrieval over scientific training data, methodology-driven programme generation, and multi-model orchestration (Claude, ChatGPT, Gemini)."

      - company: MetaKing Studios
        position: Project Manager
        start_date: 2022-02
        end_date: 2024-02
        location: Stockholm, Sweden
        highlights:
          - Shipped BLOCKLORDS, an online blockchain strategy game that reached $40M in trade volume; led a 10-person cross-timezone team and cut deployment projection 6 → 4 months at 97% sprint velocity.
          - Coordinated the team across Jira, Asana, and Miro from architecture to game economy (using Machinations) to the Unity build, plus a Unity-to-blockchain bridge designed to stay non-intrusive so players never had to touch the on-chain layer to enjoy the game.
          - "Owned go-to-market for the BLOCKLORDS launch: marketing materials, community activation across Discord, Telegram, and X, partnerships with Web3 gaming guilds, launch-day coordination across regions, and on-chain growth tracking after launch."
          - Built Grafana and Tableau dashboards for on-chain analytics, giving leadership real-time visibility into game-economy health and player behaviour.

      - company: Seascape Network
        position: Program Manager & Data Analyst
        start_date: 2020-03
        end_date: 2022-02
        location: Seoul / Stockholm / Lisbon
        highlights:
          - Shipped 5 gaming launches across Ethereum, Polygon, and BSC; managed Lighthouse, a fund-generating platform supporting 10+ external game developers; negotiated ~$500K investor funding (~9 months runway).
          - Partner-ecosystem analytics drove 30+ integration decisions and 460% MAU growth (10K → 56K).

    projects:
      - name: '[Charles](https://charles-website-ten.vercel.app/)'
